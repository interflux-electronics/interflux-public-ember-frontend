server
{
  listen 80;
  listen [::]:80;

  server_name interflux.fr;
  server_name interflux.lu;
  server_name www.interflux.fr;
  server_name www.interflux.lu;

  return 301 https://interflux.fr$request_uri;
}

server
{
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name www.interflux.fr;

  ssl_certificate /etc/letsencrypt/live/www.interflux.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.interflux.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://interflux.fr$request_uri;
}

server
{
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name interflux.fr;

  root /var/www/interflux.fr/dist;
  index index.html;

  # 1. First, check the exact path (robot.txt, favicon.ico, ...)
  # 2. Second, attempt server side render + hydration (Ember Fastboot)
  # 3. Third, attempt client side render (Ember)
  
  location / {
    try_files $uri @fastboot; # Do not add /index.html at the end.
  }

  location @fastboot {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    # interflux.com = 4800
    # interflux.de = 4801
    # interflux.es = 4802
    # interflux.fr = 4803
    # interflux.mx = 4804
    # interflux.cn.com = 4805
    proxy_pass http://127.0.0.1:4803;

    # When Ember Fastboot (SSR) fails to respond, serve Ember classic (CSR).
    proxy_intercept_errors on;
    error_page 404 500 502 =200 /index.html;
  }

  error_page 500 /500.html;
  error_page 502 /500.html;
  error_page 404 /500.html;

  ssl_certificate /etc/letsencrypt/live/interflux.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/interflux.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/www/interflux.fr/logs/nginx/access.log;
  error_log /var/www/interflux.fr/logs/nginx/error.log;
}
